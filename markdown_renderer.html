<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        .markdown-body {
            max-width: 900px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .markdown-body h1 { color: var(--primary); margin-bottom: 1.5rem; }
        .markdown-body h2 { margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .markdown-body p { margin-bottom: 1rem; color: var(--text-dim); }
        .markdown-body code { background: rgba(0,0,0,0.3); padding: 0.2rem 0.4rem; border-radius: 4px; }
        .markdown-body pre { background: #000 !important; padding: 1rem; border-radius: 8px; overflow-x: auto; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; margin-bottom: 2rem; }
    </style>
</head>
<body class="dark-mode">
    <header id="main-header">
        <nav class="top-nav">
            <div class="logo">
                <a href="index.html" class="gradient-text" style="text-decoration: none;">Semantic Search</a>
            </div>
            <div class="nav-controls">
                <button id="debug-toggle" class="btn-icon"><i data-lucide="bug"></i></button>
            </div>
        </nav>
        <nav id="debug-menu" class="debug-menu hidden"><div id="debug-links" class="menu-items"></div></nav>
        <nav id="content-menu" class="content-menu"><div id="content-links" class="menu-items"></div></nav>
    </header>

    <main class="markdown-body">
        <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Home</a>
        <div id="content">Loading documentation...</div>
    </main>

    <script src="nav.js"></script>
    <script>
        async function loadMarkdown() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            if (!fileName) {
                document.getElementById('content').innerHTML = 'No file specified.';
                return;
            }

            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error('File not found');
                const text = await response.text();
                document.getElementById('content').innerHTML = marked.parse(text);
                Prism.highlightAll();
                document.title = `${fileName} | Documentation`;
            } catch (err) {
                document.getElementById('content').innerHTML = `Error loading file: ${err.message}`;
            }
        }
        loadMarkdown();
        lucide.createIcons();
    </script>
</body>
</html>
