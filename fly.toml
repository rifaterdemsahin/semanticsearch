app = "semanticsearch-backend"
primary_region = "ams"

[build]
  dockerfile = "5_Symbols/Dockerfile"
  ignorefile = ".dockerignore"

[env]
  QDRANT_URL = "https://semantic-search-qdrant.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 1024
